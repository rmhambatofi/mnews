<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}News IA{% endblock %} · mnews</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">🗞️ News IA</a>
  {% if session.get('auth') %}
  <nav>
    <a href="{{ url_for('index') }}">Newsletters</a>
    <a href="{{ url_for('sources') }}">Sources</a>
    <a href="{{ url_for('items') }}">Articles</a>
    <a href="{{ url_for('runs') }}">Exécutions</a>
    <a href="{{ url_for('logout') }}">Déconnexion</a>
  </nav>
  {% endif %}
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
